[package]
name = "mc-structure"
version = "0.1.0"
edition = "2024"
# 最低 1.91.1，推荐 1.94
rust-version = "1.91.1"
license = "MIT"
description = "Minecraft 结构文件解析：基岩版 .mcstructure、Java 版结构 .nbt 与 Litematica 投影 .litematic → 统一的结构模型（调色板 + 方块），带资源上限与可定位的错误"
repository = "https://github.com/your-org/mc-structure"
keywords = ["minecraft", "nbt", "mcstructure", "litematic", "structure"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[dependencies]
# Java 的 NBT 字符串是「修改版 UTF-8」，交给现成的库编解码
cesu8 = "1"
flate2 = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
