[package]
name = "mc-structure"
version = "0.1.0"
edition = "2024"
# Minimum 1.91.1; 1.94 recommended
rust-version = "1.91.1"
license = "MIT"
description = "Parser for Minecraft structure files (Bedrock .mcstructure, Java structure .nbt, Litematica .litematic) into one model: palette plus blocks, with resource limits and errors that point at the offending byte"
repository = "https://github.com/Redstone-Circuit-Communication/mc-structure"
keywords = ["minecraft", "nbt", "mcstructure", "litematic", "structure"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[dependencies]
# Java NBT strings are "modified UTF-8"; an existing crate handles the encoding
cesu8 = "1"
flate2 = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
