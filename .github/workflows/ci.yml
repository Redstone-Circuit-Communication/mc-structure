name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        toolchain: ["1.91.1", "1.94", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --check
        if: matrix.toolchain == '1.94'
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.toolchain == '1.94'
      - run: cargo test --locked

  # Golden samples: the Python reference implementation recomputes them, and the result must match tests/fixtures.rs
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tools
          for f in ../tests/fixtures/*.mcstructure; do
            d=$(python3 golden.py "$f" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read().split(" ",1)[1])["digest"])')
            grep -q "$d" ../tests/fixtures.rs || { echo "digest $d of $f is not in tests/fixtures.rs"; exit 1; }
          done
      # Schematic and vanilla fixtures: digests must match tests/litematic.rs, and regenerated fixtures must read the same as the
      # committed ones (compared by content, not bytes: compressed output depends on the zlib version)
      - run: |
          cd tools
          for f in ../tests/fixtures/*.litematic ../tests/fixtures/door_*.nbt ../tests/fixtures/multi_region_flat.nbt; do
            d=$(python3 litematic.py read "$f" | python3 -c 'import sys,json; print(json.loads(sys.stdin.read().split(" ",1)[1])["digest"])')
            grep -q "$d" ../tests/litematic.rs || { echo "digest $d of $f is not in tests/litematic.rs"; exit 1; }
          done
          python3 litematic.py gen /tmp/regen
          for f in /tmp/regen/*; do
            a=$(python3 litematic.py read "$f" | cut -d' ' -f2-)
            b=$(python3 litematic.py read "../tests/fixtures/$(basename "$f")" | cut -d' ' -f2-)
            [ "$a" = "$b" ] || { echo "$f reads differently after regeneration"; exit 1; }
          done
